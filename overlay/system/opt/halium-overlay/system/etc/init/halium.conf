# Halium init config
description "Halium init"
author "Halium"

start on started android-init
stop on stopping android-init

script
    echo "Starting Halium init..."
    mount -t proc proc /proc
    mount -t sysfs sysfs /sys
    mount -t devtmpfs devtmpfs /dev
    
    # Start LXSession
    exec /usr/bin/lxsession -s ubuntu-touch -e LXDE
end script
