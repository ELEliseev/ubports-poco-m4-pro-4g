# The vendor HALs inside the Halium container are 32-bit (for example
# /vendor/bin/hw/android.hardware.media.c2@1.2-mediatek), and 32-bit bionic does
# not work with pid > 65535: "32 bit bionic libc only accepts pid <= 65535".
# Ubuntu's default is 4194304 (/lib/sysctl.d/50-pid-max.conf), so after about a
# day of uptime the counter runs past the limit: the Codec2 service wedges in a
# futex, video stops decoding, and hwbinder transactions pile up unanswered.
#
# The file name must sort AFTER 50-pid-max.conf, or Ubuntu's default overrides
# this line.
kernel.pid_max = 32768
