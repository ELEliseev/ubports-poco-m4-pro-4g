# Mir tries to open hwcomposer as a first-generation HAL, and in doing so loads
# the vendor module into its own process. Two copies of the HAL then fight over
# the display: both register IComposerExt, the composer@2.1 service dies, and
# Mir is left with an "unconnected display". Hide the module from lightdm alone
# — the container keeps its own copy and works normally.
[Service]
PrivateMounts=yes
BindPaths=/etc/systemd/system/empty-hal.so:/android/vendor/lib64/hw/hwcomposer.mt6781.so
BindPaths=/etc/systemd/system/lsc-wrapper-fleur:/usr/share/ubuntu-touch-session/lsc-wrapper
