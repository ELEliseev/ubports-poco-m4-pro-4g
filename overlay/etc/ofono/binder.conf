# ofono-binder-plugin configuration for fleur (MediaTek MT6781).
#
# The plugin finds the IRadio service instances by itself, but it will not
# create a modem for a slot that has no D-Bus path, and it logs
# "Missing path for slot <name>" instead. MediaTek publishes eight instances -
# slot1, slot2, em1, em2, se1, se2, imsAospSlot1, imsAospSlot2 - of which only
# the two real SIM slots are of any use here.
#
# The ofono-binder-plugin-ext-mtk package supplies the MediaTek IRadio
# extension and is picked up automatically.

[Settings]
ExpectSlots=slot1,slot2
IgnoreSlots=em1,em2,se1,se2,imsAospSlot1,imsAospSlot2

[slot1]
path=/ril_0
slot=0

[slot2]
path=/ril_1
slot=1
